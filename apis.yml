aid: ardent
name: Ardent
description: >-
  Ardent is a database branching platform for Postgres that lets developers and AI coding
  agents clone any production or development database in seconds into fully isolated, disposable
  branches. Each branch is isolated at both the compute and storage layers using copy-on-write,
  autoscales to zero when idle, and never touches production, so agents and CI/CD pipelines can
  run migrations, backfills, destructive tests, and risky experiments against production-like data
  with zero blast radius. Ardent exposes a REST API (api.tryardent.com), a first-party npm CLI
  (ardent-cli), and connectors for Supabase, AWS RDS, PlanetScale, and self-hosted Postgres 13+.
