openapi: 3.2.0
info:
  title: Fast V1 Connectors API
  version: 0.1.0
tags:
- name: v1-connectors
paths:
  /v1/connectors:
    post:
      tags:
      - v1-connectors
      summary: Create Connector Endpoint
      description: 'Create new connector after source prerequisite validation.


        Flow:

        1. Validate connection_details schema for service_name

        2. Run the row-less PostgreSQL source prerequisite gate

        3. Store connection details in Key Vault

        4. Save connector to database

        5. Return connector (without schema_structure - call /discover next)


        Response time: 500ms-1s (fast validation only)


        Note: After creating, call POST /connectors/{id}/discover to run schema discovery.


        Preflight gate scope: steps 1-2 run for every PostgreSQL create where

        ``byoc`` is None — this deliberately includes BYOC-environment

        (``use_environment=True``, ARN-based) connectors as well as direct

        (no-environment) connectors. For the BYOC-environment path the gate

        probes the source through the discovery tunnel (``private_link_id`` +

        resolved ``byoc_access_credentials`` are forwarded to

        ``run_discovery_preflight``), so the source is validated before any row

        or secret is written. Only Neon-BYOC (``byoc=''neon''``) and non-PostgreSQL

        creates skip the gate.'
      operationId: create_connector_endpoint_v1_connectors_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectorRequest'
      responses:
        '200':
          description: The created connector row plus `can_update`/`can_delete`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRow'
        '400':
          description: Validation, placement, or private-network configuration error.
        '422':
          description: Preflight hasn't passed for this source; the body is the full preflight report. (A malformed request body also returns 422.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightReport'
    get:
      tags:
      - v1-connectors
      summary: List Connectors Endpoint
      description: 'List all connectors for an org with optional filters.


        RLS automatically filters to connectors user can access.'
      operationId: list_connectors_endpoint_v1_connectors_get
      parameters:
      - name: org_id
        in: query
        required: true
        schema:
          type: string
          title: Org Id
      - name: connector_category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Category
      - name: service_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}:
    get:
      tags:
      - v1-connectors
      summary: Get Connector Endpoint
      description: 'Get single connector with full schema_structure and computed status fields.


        Computed fields:

        - needs_reselection: True if schema_version > selection_schema_version

        - needs_reindex: True if selected_schema_version > last_indexed_version'
      operationId: get_connector_endpoint_v1_connectors__connector_id__get
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRow'
        '404':
          description: Connector not found (or not visible to the caller).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - v1-connectors
      summary: Update Connector Endpoint
      description: Update connector. If connection_details changed, re-tests connection and resets indexing_status.
      operationId: update_connector_endpoint_v1_connectors__connector_id__put
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectorRequest'
      responses:
        '200':
          description: The updated connector row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRow'
        '400':
          description: Validation error.
        '404':
          description: Connector not found (or not visible to the caller).
        '409':
          description: Another update to this connector is already running.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - v1-connectors
      summary: Delete Connector Endpoint
      description: 'Delete connector and all associated resources.


        Cleanup handled by the DBOS connector-delete workflow:

        - Branching engine infrastructure (replication pipeline, compute, slot)

        - Delayed stored credential purge after DB finalization

        - Database record


        Args:

        force: When true, bypass the in-flight WAL/Kafka drain wait

        (ARD-870). Customer accepts that any un-replicated data is

        abandoned; the un-drained delta is recorded in cleanup_failures

        for operator triage.'
      operationId: delete_connector_endpoint_v1_connectors__connector_id__delete
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '202':
          description: Delete accepted (or already in progress). Poll `GET /v1/operations/{operation_id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationHandle'
        '403':
          description: No delete permission on this connector.
        '404':
          description: Connector not found (or not visible to the caller).
        '409':
          description: Deletion is locked, or a conflicting delete is active.
        '503':
          description: Ardent could not start the work — safe to retry.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}/connection-details:
    get:
      tags:
      - v1-connectors
      summary: Get Connector Connection Details Endpoint
      description: 'Get decrypted connection details for a connector.


        NO KNOWN CONSUMER. This docstring previously claimed an "Edit Connection

        Details modal" calls it; ``grep -rn ''connection-details'' frontend/`` returns

        zero hits, and neither the CLI (``packages/``) nor the ``tests_two``

        harnesses call it. ``scripts/export_public_openapi.py:45`` deliberately

        keeps it OUT of the published spec as an endpoint "that returns credentials

        or debug detail". So it is reachable but undocumented and unreferenced —

        which is the reason the ARD-2127 redaction below could be made

        unconditional without breaking a caller.


        Returns only the connection_details dict with decrypted values.

        Does NOT include schema_structure or other connector fields.


        Security:

        - Requires authentication (JWT or API key) and NOTHING else: there is no

        ``require_permission`` gate, so every member of the org that RLS lets see

        the connector can read whatever this returns.

        - RLS automatically enforces that user has access to this connector

        - Connection details are decrypted from Azure Key Vault

        - ARD-2127: the TLS PEM fields are stripped from the response

        unconditionally. ``ssl_client_key`` is a private key and must never be

        readable back out of an API that only checks authentication.


        The two CERTIFICATE fields are not secret and are not being protected

        here. A client certificate is presented in cleartext to the customer''s

        database on every TLS handshake, and this PR deliberately PUBLISHES its

        identity — subject, issuer, validity window, SHA-256 fingerprint — as

        ``source_metadata.source_tls_client_certificate``, which ``GET

        /v1/connectors`` and ``GET /v1/connectors/{id}`` return to a wider

        audience behind the same auth class (``_public_connector_response``

        strips only ``source_in_eks_vpc``). They are excluded from this endpoint

        only to keep ONE rule for all three PEM fields rather than a per-field

        carve-out that drifts the next time a field is added — and because

        nothing consumes them here.'
      operationId: get_connector_connection_details_endpoint_v1_connectors__connector_id__connection_details_get
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}/deletion-lock:
    post:
      tags:
      - v1-connectors
      summary: Lock Connector Deletion Endpoint
      description: Lock connector deletion until an authorized caller unlocks it.
      operationId: lock_connector_deletion_endpoint_v1_connectors__connector_id__deletion_lock_post
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorDeletionLockRequest'
      responses:
        '200':
          description: The locked connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorEnvelope'
        '403':
          description: No update permission on this connector.
        '404':
          description: Connector not found (or not visible to the caller).
        '409':
          description: A delete is already in progress.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - v1-connectors
      summary: Unlock Connector Deletion Endpoint
      description: Clear the connector deletion lock.
      operationId: unlock_connector_deletion_endpoint_v1_connectors__connector_id__deletion_lock_delete
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      responses:
        '200':
          description: The unlocked connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorEnvelope'
        '403':
          description: No update permission on this connector.
        '404':
          description: Connector not found (or not visible to the caller).
        '409':
          description: A delete is already in progress.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}/quarantine:
    get:
      tags:
      - v1-connectors
      summary: List Connector Quarantines Endpoint
      description: 'List active quarantine rows for a connector.


        Returns rows where status=''quarantined''. Released rows are transient

        (deleted by the monitor after scale-up) and are not listed here.'
      operationId: list_connector_quarantines_endpoint_v1_connectors__connector_id__quarantine_get
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      responses:
        '200':
          description: Active (paused) replication deployments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineListResponse'
        '404':
          description: Connector not found (or not visible to the caller).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}/readiness-checks:
    get:
      tags:
      - v1-connectors
      summary: List Connector Readiness Checks Endpoint
      description: 'List ARD-720 post-snapshot validation evidence for this connector.


        Returns the append-only paper trail of per-table checks the engine-setup

        gate emitted on each attempt. The schema''s

        ``branch_readiness_checks_select_policy`` enforces RLS via

        ``current_user_accessible_connectors`` — callers see only the rows for

        connectors they have read access to.


        A connector that''s stuck in ``failed_validation`` will surface its

        failing rows here (combine with ``?only_failed=true``); customers use

        this to understand why their branch isn''t routing without needing

        operator intervention.'
      operationId: list_connector_readiness_checks_endpoint_v1_connectors__connector_id__readiness_checks_get
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      - name: attempt_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Attempt Id
      - name: check_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Check Name
      - name: only_failed
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Only Failed
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}/readiness-attempts:
    get:
      tags:
      - v1-connectors
      summary: List Connector Readiness Attempts Endpoint
      description: 'Roll up branch_readiness_checks into one summary per engine-setup attempt.


        Returns ``{attempt_id, total_checks, passed_checks, failed_checks,

        latest_checked_at, pod_name}`` per attempt, sorted with the most recent

        attempt first. Customers land here to find the right ``attempt_id`` to

        drill into via ``/readiness-checks?attempt_id=...``.'
      operationId: list_connector_readiness_attempts_endpoint_v1_connectors__connector_id__readiness_attempts_get
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}/quarantine/{quarantine_id}/release:
    post:
      tags:
      - v1-connectors
      summary: Release Quarantine Endpoint
      description: 'Release a quarantined CDC pipeline for this connector.


        Flips the quarantine row to status=''released''. The quarantine monitor

        picks this up on its next tick (up to QUARANTINE_POLL_SECONDS later) and

        restores the pipeline. Idempotent.


        Requires connectors.update permission on the parent connector.'
      operationId: release_quarantine_endpoint_v1_connectors__connector_id__quarantine__quarantine_id__release_post
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      - name: quarantine_id
        in: path
        required: true
        schema:
          type: string
          title: Quarantine Id
      responses:
        '200':
          description: The released quarantine entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineRow'
        '403':
          description: No update permission on this connector.
        '404':
          description: Connector or quarantine entry not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}/discover:
    post:
      tags:
      - v1-connectors
      summary: Discover Connector Endpoint
      description: 'Dispatch the connector''s schema discovery (ARD-1098).


        The connectivity + branching-prerequisites gate runs synchronously

        (fast after ARD-1095). On gate success the per-database catalog walk

        is dispatched as a ``connector_discovery`` async_operation and the

        endpoint returns **202** with the operation id plus the prerequisite

        payload — enough for the customer to know "your connection works"

        before the schema crawl finishes. On gate failure (network

        unreachable, auth, missing prereqs) the endpoint returns 422 with a

        structured remediation message; no worker is dispatched.


        The CLI polls ``GET /v1/operations/{operation_id}`` for the

        terminal status of the catalog walk. Concurrent /discover calls on

        the same connector are deduped by the async_operations partial unique

        index — the second call rejoins the in-flight operation rather than

        launching a second crawl.


        Always reads credentials from Key Vault (single source of truth). To

        update credentials first, call PUT /connectors/{connector_id}.'
      operationId: discover_connector_endpoint_v1_connectors__connector_id__discover_post
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      responses:
        '202':
          description: Discovery started (or joined, if one is already running). Poll the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverAccepted'
        '400':
          description: The connector isn't in a state that can be discovered.
        '404':
          description: Connector not found (or not visible to the caller).
        '422':
          description: Discovery prerequisites failed.
        '503':
          description: Ardent could not start the work — safe to retry.
  /v1/connectors/preflight:
    post:
      tags:
      - v1-connectors
      summary: Preflight Connector Endpoint
      description: 'Validate a source DB without persisting a connector row (ARD-1146).


        The customer''s pain this closes: today the only way to learn that

        your source is misconfigured is to run ``ardent connector create``,

        which persists a row + writes credentials to Key Vault + runs the

        duplicate-source fingerprint check at row-create time. Hitting any

        discovery failure leaves the customer in a delete/retry loop.


        Preflight calls :func:`run_discovery_preflight` (the row-less sibling

        of :func:`run_discovery_gate`), which reuses

        ``PostgresDiscoveryHandler.gate()`` against inline credentials —

        *exactly* the function ``/discover`` runs synchronously. No row, no

        AKV write, no replication slot side effects.


        HTTP semantics:

        - 200 whenever the source DB was actually probed; per-check failure

        detail lives in the response body. The customer is asking a

        question, not asking us to commit state.

        - 400 for request-shape errors (malformed ``connection_details``,

        unknown ``service_name``, **active-private-link symmetry violation**:

        an ``environment_id`` with an active private link cannot be probed

        without ``private_link_id`` because the probe would hit the wrong

        egress).

        - 403 for missing ``connectors.create``.

        - 500 for tunnel / AKV failures we cannot reduce to a check entry.


        Compare with ``/discover`` which returns 422 on gate-fail because

        discover writes state and the gate result drives that state.'
      operationId: preflight_connector_endpoint_v1_connectors_preflight_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreflightConnectorRequest'
        required: true
      responses:
        '200':
          description: The full preflight report. A failed gate is still a 200 — read `preflight_pass`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightReport'
        '400':
          description: Unsupported service, or the connection details failed validation.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}/grant-script:
    post:
      tags:
      - v1-connectors
      summary: Grant Script Endpoint
      description: 'Return the minimal-privilege psql script the customer should run on their source

        PostgreSQL to grant the replication user the access pgstream needs.


        Output shape (idempotent — same connector + same selection => same script):

        {

        "sql": "...complete psql artifact...",

        "source_provider": "rds" | "supabase" | "cloudsql" | "vanilla" | ...,

        "replication_username": "",

        "schemas_per_database": {"": ["", ...], ...}

        }


        The SQL covers (per ARD-1051):

        - the replication role attribute (provider-specific line),

        - GRANT CONNECT + GRANT CREATE per database (so pgstream can

        CREATE PUBLICATION and its bookkeeping schema),

        - GRANT USAGE + SELECT on tables and sequences per schema,

        - ALTER DEFAULT PRIVILEGES for both TABLES and SEQUENCES so

        objects added to source AFTER the grants run also replicate.


        Errors:

        - 404 — connector not found / no RLS access.

        - 422 — connector is not a PostgreSQL service, discovery has not

        run, no schemas selected, or connection_details is missing the

        username field. The detail string names the exact next step.

        - 500 — Key Vault decryption failed.


        Note for RDS sources: this endpoint emits the GRANT line; the

        rds.logical_replication parameter still has to be set to 1 in the

        cluster''s parameter group and the instance restarted before logical

        replication will work. The grant-script comment header reminds the

        customer.'
      operationId: grant_script_endpoint_v1_connectors__connector_id__grant_script_post
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}/selection:
    post:
      tags:
      - v1-connectors
      summary: Set Selection Endpoint
      description: 'Set entity selection for indexing.


        This determines which entities (databases, schemas, tables) from the discovered

        schema will be indexed and available for querying.


        Special Selection Mode:

        - Use "*" in selected_paths to select ALL entities (wildcard selection)

        - Example: {"selected_paths": ["*"]} will index the entire discovered schema


        Flow:

        1. Load current connector and schema_structure

        2. Prune schema tree to only include selected paths (or use full schema if "*")

        3. Update DB with:

        - selected_entity_paths (user''s input)

        - selected_schema_structure (pruned tree or full schema)

        - selection_schema_version (snapshot of current schema_version)

        - selected_schema_version (incremented counter)

        4. Return pruned schema


        After selection, user must call POST /{connector_id}/index to apply changes.


        Requirements:

        - User must have admin access to connector''s org

        - Connector must exist with schema_structure (discovery completed)


        WARNING: This does NOT auto-include FK targets! If you select tables with

        foreign key relationships, you must manually select the referenced tables

        or risk dangling references in the indexed schema.'
      operationId: set_selection_endpoint_v1_connectors__connector_id__selection_post
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectionRequest'
      responses:
        '200':
          description: The connector row with the applied selection fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRow'
        '400':
          description: No discovered schema to select from, or an invalid selection.
        '404':
          description: Connector not found (or not visible to the caller).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{connector_id}/engine-setup:
    post:
      tags:
      - v1-connectors
      summary: Engine Setup Endpoint
      description: 'Dispatch a branching-engine setup as an async operation.


        The actual provisioning (Neon project, pgstream, snapshot, RLS) runs

        5–10 minutes — far past the ALB 60s idle timeout — so this endpoint

        returns 202 with an operation_id within ~1s. The CLI polls

        GET /v1/operations/{id} for stage transitions and the terminal

        outcome (ARD-741).


        Fast paths preserved from the prior synchronous endpoint:

        - Already-healthy connector → 200 with the existing connector row.

        - Wrong starting status → 400 with the rejected status name.

        - Service has no engine-setup handler → 400.

        Anything past that point goes to the worker.


        Requirements:

        - Connector must exist

        - branching_engine_status must be retryable for setup dispatch'
      operationId: engine_setup_endpoint_v1_connectors__connector_id__engine_setup_post
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      responses:
        '202':
          description: Setup started (or joined). Poll `GET /v1/operations/{operation_id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationHandle'
        '200':
          description: 'Nothing to do: the engine is already set up. Returns the connector row with a `message`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRow'
        '400':
          description: The connector isn't in a state that can run setup.
        '403':
          description: No update permission on this connector.
        '404':
          description: Connector not found (or not visible to the caller).
        '409':
          description: A conflicting setup operation exists.
        '422':
          description: Setup prerequisites failed (for example, unresolved replica identity decisions).
        '503':
          description: Ardent could not start the work — safe to retry.
  /v1/connectors/{connector_id}/replica-identity-decisions:
    put:
      tags:
      - v1-connectors
      summary: Set Replica Identity Decisions Endpoint
      description: 'Record the customer''s per-table decisions for ARD-999 preflight.


        Every entry in ``request_body.decisions`` must:

        - have a key that matches a discovered no-replication-identity

        table for this connector (``"..

        "`` FQN), and

        - have a value of ``"exclude"``, ``"add_pk"``, or

        ``"replica_identity_full"``.


        Validation fails loud (400) on any mismatch — silent acceptance of

        keys that don''t match would let a typo persist as a dead entry that

        looks correct in the connector record but has no effect at engine

        setup time. Tables that exist in the discovered no-replication-

        identity list but are absent from ``decisions`` revert to the

        default ``"exclude"`` (the pre-ARD-999 behavior). This endpoint is

        a full replace: submit the complete decision set for every table

        that should keep a non-default decision, because omitted FQNs revert

        to ``"exclude"`` even if a prior PUT recorded a different decision.


        Response carries the updated connector with the refreshed

        ``replica_identity_preflight`` block (same shape as GET) so the CLI

        and the web wizard can render the post-write state without a follow-

        up round-trip.'
      operationId: set_replica_identity_decisions_endpoint_v1_connectors__connector_id__replica_identity_decisions_put
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplicaIdentityDecisionsRequest'
      responses:
        '200':
          description: The refreshed connector row, including `replica_identity_preflight`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRow'
        '400':
          description: A decision is invalid, covers an unknown table, or the map is incomplete.
        '403':
          description: No update permission on this connector.
        '404':
          description: Connector not found (or not visible to the caller).
        '409':
          description: The decisions could not be applied — state changed underneath; retry.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/validate-github-repo:
    post:
      tags:
      - v1-connectors
      summary: Validate Github Repo Endpoint
      description: 'Validate if a GitHub repository exists and is accessible.


        This endpoint proxies the GitHub API check to avoid CORS issues from the frontend.

        Validates repository format and checks accessibility via GitHub API.


        Args:

        repo: Repository in format "username/repo"

        github_token: Optional GitHub personal access token for private repos


        Returns:

        {

        "valid": bool,

        "status": "valid" | "private" | "invalid" | "error",

        "message": str

        }'
      operationId: validate_github_repo_endpoint_v1_connectors_validate_github_repo_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateGitHubRepoRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubRepoValidationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/validate-github-auth:
    post:
      tags:
      - v1-connectors
      summary: Validate Github Auth Endpoint
      description: 'Validate GitHub authentication credentials.


        For PAT auth, this verifies the token is valid and retrieves the authenticated user.

        For OAuth/GitHub App auth, this validates the app credentials.


        Args:

        auth_type: "pat" or "oauth"

        access_token: GitHub Personal Access Token (for PAT auth)

        app_id, installation_id, private_key: GitHub App credentials (for OAuth)


        Returns:

        {

        "valid": bool,

        "status": "valid" | "invalid" | "error",

        "message": str,

        "username": str | None # The authenticated user/app name

        }'
      operationId: validate_github_auth_endpoint_v1_connectors_validate_github_auth_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateGitHubAuthRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAuthValidationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ConnectorEnvelope:
      properties:
        connector:
          $ref: '#/components/schemas/ConnectorRow'
          description: The connector's current row.
      type: object
      required:
      - connector
      title: ConnectorEnvelope
      description: Spec-only wrapper used by the deletion-lock endpoints.
    GitHubRepoValidationResponse:
      properties:
        valid:
          type: boolean
          title: Valid
        status:
          type: string
          enum:
          - valid
          - private
          - invalid
          - error
          title: Status
        message:
          type: string
          title: Message
      type: object
      required:
      - valid
      - status
      - message
      title: GitHubRepoValidationResponse
    ReplicaIdentityDecisionsRequest:
      properties:
        decisions:
          additionalProperties:
            type: string
          type: object
          title: Decisions
          description: 'Per-table decision: `exclude`, `add_pk`, or `replica_identity_full`.'
      type: object
      required:
      - decisions
      title: ReplicaIdentityDecisionsRequest
      description: 'Body for PUT /v1/connectors/{id}/replica-identity-decisions (ARD-999).


        ``decisions`` is the FULL set of per-table decisions for the

        connector''s currently-discovered no-replication-identity tables. The

        endpoint replaces (not merges) the persisted dict — customers

        submit a complete view of their choices, and re-discovery

        deliberately invalidates stale decisions so the customer re-confirms

        after a schema change.


        Pydantic-side validation only verifies the dict shape (str -> str);

        semantic validation (key matches a discovered table, value is one of

        the allowed decisions) runs inside the route handler via the policy

        module so error messages can reference the discovered list.'
    PreflightConnectorRequest:
      properties:
        org_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Id
          description: Organization to preflight for. Inferred from your auth when omitted.
        service_name:
          type: string
          title: Service Name
          description: Service type. `postgresql` is the only supported value today.
        connection_details:
          additionalProperties: true
          type: object
          title: Connection Details
          description: Connection details for the source database. Nothing is stored.
        byoc:
          anyOf:
          - type: string
            const: neon
          - type: 'null'
          title: Byoc
        selected_schemas:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Selected Schemas
          description: Schemas to render in the grant script. Affects only `grant_script`.
        database:
          anyOf:
          - type: string
          - type: 'null'
          title: Database
          description: Database to render in the grant script. Affects only `grant_script`.
        use_environment:
          type: boolean
          title: Use Environment
          description: Route preflight through a customer-cloud environment.
          default: false
        environment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment Id
          description: Customer-cloud environment; required when your org has more than one.
        private_link_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Private Link Id
          description: Private connection for the source database; needs `use_environment`.
        allow_high_rtt_placement:
          type: boolean
          title: Allow High Rtt Placement
          description: Allow customer-cloud placement far from the worker region.
          default: false
      type: object
      required:
      - service_name
      - connection_details
      title: PreflightConnectorRequest
      description: 'Inline-credentialed prerequisite check before any connector row exists (ARD-1146).


        Mirrors the CreateConnectorRequest connection surface so the CLI and

        wizard can call preflight with the exact same form values they would

        POST to /v1/connectors. No row is persisted, no credentials reach

        Key Vault — the asyncpg connection lives only for the request lifetime.


        ``selected_schemas`` and ``database`` are optional and affect only the

        grant_script block in the response. When either is omitted, the

        grant_script renders the replication-role-attribute line plus an

        editable per-database / per-schema template.'
    ValidateGitHubRepoRequest:
      properties:
        repo:
          type: string
          title: Repo
        github_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Github Token
      type: object
      required:
      - repo
      title: ValidateGitHubRepoRequest
    OperationHandle:
      properties:
        operation_id:
          type: string
          title: Operation Id
          description: Operation to poll at `GET /v1/operations/{operation_id}`.
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: Status at acceptance time.
        type:
          $ref: '#/components/schemas/OperationType'
          description: The kind of work this operation tracks, for example `branch_create`.
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
          description: ID of the resource being created or acted on (the branch ID for branch create).
      type: object
      required:
      - operation_id
      - status
      - type
      - resource_id
      title: OperationHandle
      description: '202 acceptance body for async endpoints (branch create today).


        Declared on routes so the OpenAPI spec documents the handle shape.

        Handlers keep building the dict by hand; declaring this model on a

        route is spec-only and never changes a live response.'
    ConnectorRow:
      properties:
        id:
          type: string
          title: Id
          description: Connector ID.
        org_id:
          type: string
          title: Org Id
          description: Organization the connector belongs to.
        project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
          description: Project the connector belongs to.
        name:
          type: string
          title: Name
          description: Connector name.
        service_name:
          type: string
          title: Service Name
          description: Service type. `postgresql` today.
        status:
