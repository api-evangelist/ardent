      - org_id
      - name
      - service_name
      title: ConnectorRow
      description: 'Loose core of a connector response.


        The connector row is the most dynamic shape in the system; extra="allow"

        is the contract — responses carry many more columns and clients must

        tolerate fields not listed here. can_update/can_delete are added by the

        permission projection on create/get/update/list responses.'
    GitHubAuthValidationResponse:
      properties:
