openapi: 3.2.0
info:
  title: Fast V1 Projects API
  version: 0.1.0
tags:
- name: v1 projects
paths:
  /v1/projects:
    post:
      tags:
      - v1 projects
      summary: Create Project Endpoint
      description: Create a new project.
      operationId: create_project_endpoint_v1_projects_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: The created project row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRow'
        '409':
          description: A project with this name already exists.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - v1 projects
      summary: List Projects Endpoint
      description: List all projects for an org. RLS automatically filters by access.
      operationId: list_projects_endpoint_v1_projects_get
      parameters:
      - name: org_id
        in: query
        required: true
        schema:
          type: string
          title: Org Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/projects/{project_id}:
    get:
      tags:
      - v1 projects
      summary: Get Project Endpoint
      description: Get a single project.
      operationId: get_project_endpoint_v1_projects__project_id__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRow'
        '404':
          description: Project not found (or not visible to the caller).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - v1 projects
      summary: Update Project Endpoint
      description: Update mutable project fields. Only provided fields are changed.
      operationId: update_project_endpoint_v1_projects__project_id__patch
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: The updated project row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRow'
        '400':
          description: No fields to update.
        '404':
          description: Project not found (or not visible to the caller).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - v1 projects
      summary: Delete Project Endpoint
      description: Delete a project. Cascades to child resources via ON DELETE CASCADE.
      operationId: delete_project_endpoint_v1_projects__project_id__delete
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: 'Deleted. Body is `{"message": "Project deleted"}`.'
          content:
            application/json:
              schema: {}
        '403':
          description: Not authorized to delete this project.
        '404':
          description: Project not found (or not visible to the caller).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ProjectListResponse:
      properties:
        projects:
          items:
            $ref: '#/components/schemas/ProjectRow'
          type: array
          title: Projects
          description: Projects visible to the caller.
      type: object
      required:
      - projects
      title: ProjectListResponse
      description: Spec-only wrapper for GET /v1/projects.
    UpdateProjectRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
          description: New project name (1-100 characters).
      type: object
      title: UpdateProjectRequest
    CreateProjectRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: Project name (1-100 characters).
        org_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Id
          description: Organization to create the project in. Inferred from your auth when omitted.
      type: object
      required:
      - name
      title: CreateProjectRequest
    ProjectRow:
      properties:
        id:
          type: string
          title: Id
          description: Project ID.
        org_id:
          type: string
          title: Org Id
          description: Organization the project belongs to.
        name:
          type: string
          title: Name
          description: Project name.
        created_at:
          type: string
          title: Created At
          description: When the project was created.
      additionalProperties: true
      type: object
      required:
      - id
      - org_id
      - name
      - created_at
      title: ProjectRow
      description: 'One projects-table row, as returned by these endpoints.


        Spec-only: handlers return raw rows (select *) via JSONResponse, so

        this documents the stable core without filtering. extra="allow" —

        rows may carry additional audit columns.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
