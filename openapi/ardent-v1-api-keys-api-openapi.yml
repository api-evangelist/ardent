openapi: 3.2.0
info:
  title: Fast V1 API Keys API
  version: 0.1.0
tags:
- name: v1-api-keys
paths:
  /v1/orgs/{org_id}/api-keys:
    get:
      tags:
      - v1-api-keys
      summary: List Api Keys
      description: 'List all API keys for the organization, active and revoked.


        Requires ''api_keys.read'' permission.


        Returns:

        List of API keys (without secret keys)'
      operationId: list_api_keys_v1_orgs__org_id__api_keys_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      responses:
        '200':
          description: Active keys first (newest first), then revoked keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  $ref: '#/components/schemas/APIKeyListItem'
                title: Response 200 List Api Keys V1 Orgs  Org Id  Api Keys Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - v1-api-keys
      summary: Create New Api Key
      description: 'Create a new API key for the organization.


        Requires ''api_keys.create'' permission.


        ⚠️ IMPORTANT: The secret key is only shown ONCE upon creation.

        Store it securely - you won''t be able to retrieve it again!


        The API key will be granted a role assignment with the specified role_id.

        The role determines what permissions the API key has access to.


        Common role IDs:

        - role_org_viewer: Read-only access

        - role_org_member: Create and modify resources

        - role_org_admin: Full administrative access (except deleting org)

        - role_org_owner: Full control over organization


        Args:

        org_id: Organization ID

        body: API key details (name, role_id, scopes, expiration)


        Returns:

        API key details INCLUDING the secret key (only time it''s shown)'
      operationId: create_new_api_key_v1_orgs__org_id__api_keys_post
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: The created key, including the secret — shown only this once.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create New Api Key V1 Orgs  Org Id  Api Keys Post
                $ref: '#/components/schemas/APIKeyCreateResponse'
        '400':
          description: Unknown role, non-org role, or a scope outside the role's permissions.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/orgs/{org_id}/api-keys/{api_key_id}:
    delete:
      tags:
      - v1-api-keys
      summary: Revoke Api Key Endpoint
      description: 'Revoke (delete) an API key.


        Requires ''api_keys.delete'' permission.


        Args:

        org_id: Organization ID

        api_key_id: API key ID to revoke


        Returns:

        204 No Content on success'
      operationId: revoke_api_key_endpoint_v1_orgs__org_id__api_keys__api_key_id__delete
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: api_key_id
        in: path
        required: true
        schema:
          type: string
          title: Api Key Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: API key not found or already revoked.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    APIKeyCreateResponse:
      properties:
        api_key_id:
          type: string
          title: Api Key Id
          description: ID of the created key.
        api_key:
          type: string
          title: Api Key
          description: The full secret key; shown only this once — store it now.
        name:
          type: string
          title: Name
          description: Human-readable key name.
        key_prefix:
          type: string
          title: Key Prefix
          description: First characters of the key, for identifying it in lists.
        scopes:
          items:
            type: string
          type: array
          title: Scopes
          description: Permission scopes granted to the key.
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
          description: When the key expires. Null when it does not expire.
        created_at:
          type: string
          title: Created At
          description: When the key was created.
        warning:
          type: string
          title: Warning
          description: Reminder that the secret cannot be retrieved again.
        role_id:
          type: string
          title: Role Id
          description: ID of the role granted to the key.
        role_key:
          type: string
          title: Role Key
          description: The role's stable key, for example `role_org_member`.
      additionalProperties: true
      type: object
      required:
      - api_key_id
      - api_key
      - name
      - key_prefix
      - scopes
      - created_at
      - warning
      - role_id
      - role_key
      title: APIKeyCreateResponse
      description: 'Response of POST /v1/orgs/{org_id}/api-keys.


        `api_key` is the full secret (sk-ard_live_… / sk-ard_test_…) and is

        returned only here, once. Spec-only; see APIKeyListItem.'
    CreateAPIKeyRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: Descriptive name for the key
        role_id:
          type: string
          title: Role Id
          description: Role ID to grant to this API key (e.g., role_org_member)
        scopes:
          items:
            type: string
          type: array
          title: Scopes
          description: Permission keys like `connectors.read`, a subset of the role's; empty uses all.
          default: []
        expires_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires Days
          description: Days until expiration (null = never expires)
      type: object
      required:
      - name
      - role_id
      title: CreateAPIKeyRequest
      description: Request body for creating an API key
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    APIKeyListItem:
      properties:
        id:
          type: string
          title: Id
          description: API key ID.
        name:
          type: string
          title: Name
          description: Human-readable key name.
        key_prefix:
          type: string
          title: Key Prefix
          description: First characters of the key; the secret itself is never returned.
        scopes:
          items:
            type: string
          type: array
          title: Scopes
          description: Permission scopes granted to the key.
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
          description: When the key expires. Null when it does not expire.
        revoked_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked At
          description: When the key was revoked. Null for active keys.
        revoked_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked Reason
          description: 'Why the key was revoked: `admin_revoked`, `member_removed`, or `unknown_legacy` for keys revoked before the reason was recorded. Null for active keys.'
        revoked_by:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Revoked By
          description: 'Who revoked the key: `{email, full_name}`. Null for active keys and for revocations with no attributable user.'
        created_at:
          type: string
          title: Created At
          description: When the key was created.
        last_used_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Used At
          description: When the key last authenticated a request. Null when never used.
        users:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Users
          description: 'Who created the key: `{email, full_name}`.'
      additionalProperties: true
      type: object
      required:
      - id
      - name
      - key_prefix
      - scopes
      - created_at
      title: APIKeyListItem
      description: 'One row of GET /v1/orgs/{org_id}/api-keys. Never includes the secret.


        Spec-only: the handler returns plain dicts, so this model documents the

        shape without filtering (do not attach it as response_model).'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
