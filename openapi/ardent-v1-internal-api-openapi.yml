  /v1/internal/environments/{environment_id}/redeploy:
    post:
      tags:
      - v1-internal
      summary: Redeploy Environment Route
      description: 'Admin-only: re-drive a BYOC environment deploy.


        `environment_deploy` now runs as a DBOS durable workflow

        (`run_environment_deploy`, `environment_deploy.v1`). A backend rollout or

        worker crash mid-deploy no longer fails the deploy — DBOS resumes it from

        the last completed step on the next worker — and the legacy reaper no

        longer governs deploy operations (it skips `runtime=''dbos''` rows). So this

        route is a manual re-drive for the residual cases the automatic path does

        not cover: a genuinely terminal failure, or a deploy whose workflow died

        after reaching a terminal error (e.g. the success write exhausted its

        retries, leaving the environment stuck `provisioning` with a terminal

        operation that nothing else re-drives). Because every deploy step is

        idempotent, customer-triggered retries are now safe too.


        Everything the workflow needs is already persisted: the `environments`

        row, its `environment_resources` rows, and the AKV-referenced

        `external_id` / `neon_api_key`. It re-reads all of it from `environment_id`

        alone, so an operator can re-drive a stuck deploy with no customer

        involvement.


        Behavior by current status:

        * `failed` — claim a fresh deploy (flip to `provisioning`, enqueue).

        * `pending` / `provisioning` — if a deploy workflow is genuinely live,

        return its operation unchanged; otherwise the prior operation stranded,

        so terminalize it and enqueue a fresh one (the environment is already

        `provisioning`).

        * anything else — 409.


        Returns 202 with an operation_id; an EKS environment deploy routinely runs

        ~25 minutes and would otherwise blow the ALB 60s idle timeout. The caller

        polls GET /v1/operations/{id} for stage transitions and the terminal

        outcome.'
      operationId: redeploy_environment_route_v1_internal_environments__environment_id__redeploy_post
      parameters:
      - name: environment_id
        in: path
        required: true
        schema:
          type: string
          title: Environment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DebeziumRollbackRequest:
      properties:
        source_database:
          type: string
          maxLength: 128
          minLength: 1
          title: Source Database
        reason:
          type: string
          maxLength: 64
          minLength: 1
          title: Reason
        evidence_source:
          type: string
          maxLength: 128
          minLength: 1
          title: Evidence Source
        evidence_reference_id:
          type: string
          maxLength: 256
          minLength: 1
          title: Evidence Reference Id
        evidence_observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Evidence Observed At
        evidence:
          additionalProperties: true
          type: object
          title: Evidence
        intent_ttl_seconds:
          type: integer
          maximum: 3600.0
          minimum: 60.0
          title: Intent Ttl Seconds
          default: 900
      type: object
      required:
      - source_database
      - reason
      - evidence_source
      - evidence_reference_id
      title: DebeziumRollbackRequest
      description: Request body for staff-triggered replication rollback.
    DebeziumMigrationReconcileRequest:
      properties:
        source_database:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Source Database
        limit:
          type: integer
          maximum: 500.0
          minimum: 1.0
          title: Limit
          default: 50
      type: object
      title: DebeziumMigrationReconcileRequest
      description: Request body for staff-triggered migration-intent reconciliation.
    DebeziumCutoverRequest:
      properties:
        source_database:
          type: string
          maxLength: 128
          minLength: 1
          title: Source Database
      type: object
      required:
      - source_database
      title: DebeziumCutoverRequest
      description: Request body for staff-triggered replication cutover.
    ConnectorRolloutRequest:
      properties:
        rollout_unit:
          type: string
          enum:
          - pgstream_image
          - data_plane_chart
          title: Rollout Unit
        pgstream_source_image:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Pgstream Source Image
        pgstream_target_digest:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Pgstream Target Digest
        data_plane_chart_sha256:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Data Plane Chart Sha256
        requires_drain:
          type: boolean
          title: Requires Drain
          default: true
      type: object
      required:
      - rollout_unit
      title: ConnectorRolloutRequest
      description: Request body for staff-triggered connector rollouts.
    DebeziumShadowCleanupRequest:
      properties:
        reason:
          type: string
          maxLength: 256
          minLength: 1
          title: Reason
        source_databases:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 100
            minItems: 1
          - type: 'null'
          title: Source Databases
      type: object
      required:
      - reason
      title: DebeziumShadowCleanupRequest
      description: Request body for staff-triggered Debezium-only shadow cleanup.
    OrphanNeonProjectReclaimRequest:
      properties:
        project_ids:
          items:
            type: string
          type: array
          maxItems: 10
          minItems: 1
          title: Project Ids
        confirm:
          type: string
          title: Confirm
      type: object
      required:
      - project_ids
      - confirm
      title: OrphanNeonProjectReclaimRequest
      description: Request body for staff-triggered orphan Neon project reclaim.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DebeziumPostCutoverReconciliationRequest:
      properties:
        source_database:
          type: string
          maxLength: 128
          minLength: 1
          title: Source Database
        run_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Run Id
        timeout_seconds:
          type: number
          maximum: 1800.0
          minimum: 30.0
          title: Timeout Seconds
          default: 300.0
        tables:
          anyOf:
          - items:
              $ref: '#/components/schemas/DebeziumTableRequest'
            type: array
            maxItems: 500
            minItems: 1
          - type: 'null'
          title: Tables
      type: object
      required:
      - source_database
      title: DebeziumPostCutoverReconciliationRequest
      description: Request body for exact post-cutover source/target reconciliation.
    MarkBranchMaskedReadyRequest:
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 1
