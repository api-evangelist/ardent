                additionalProperties: true
                type: object
                title: Response Reclaim Orphan Neon Projects Route V1 Internal Neon Orphan Projects Reclaim Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/internal/connectors/{connector_id}/recover-engine-setup:
    post:
      tags:
      - v1-internal
      summary: Recover Engine Setup Route
      description: 'Admin-only: replace a stale active connector engine-setup operation.


        This is the audited manual lever for strands where the customer retry

        endpoint must keep reusing the active async_operation, but DBOS no longer

        has a worker-executing workflow for that operation.'
      operationId: recover_engine_setup_route_v1_internal_connectors__connector_id__recover_engine_setup_post
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverEngineSetupRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/internal/connectors/{connector_id}/reset:
    post:
      tags:
      - v1-internal
      summary: Reset Connector Route
      description: 'Admin-only: dispatch a connector reset as an async operation.


        Returns 202 with an operation_id; the actual reset (drop pgstream,

        re-snapshot Neon main, re-deploy CDC) routinely runs several

        minutes and would otherwise blow the ALB 60s idle timeout. The

        caller polls GET /v1/operations/{id} for stage transitions and the

        terminal outcome (ARD-741).


        Branches and Neon project survive the reset by design — see

        reset_connector for the safety contract.


        Args:

        force: When true, bypass the in-flight WAL/Kafka drain wait

        inside the pgstream teardown step (ARD-870). Operator accepts

        that any un-replicated data is abandoned.'
      operationId: reset_connector_route_v1_internal_connectors__connector_id__reset_post
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
